<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Private Chat</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#eaf0f7;background:#101827}*{box-sizing:border-box}body{margin:0}.app{max-width:650px;margin:auto;height:100dvh;display:flex;flex-direction:column}.head{padding:18px 20px;background:#1a2638;display:flex;justify-content:space-between;align-items:center}.small{color:#9aaac1;font-size:12px}.head strong{display:block;font-size:18px}.head button,.composer button,.panel button{border:0;border-radius:12px;padding:12px;background:#5a88e8;color:white;font-weight:600}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{align-self:flex-end;background:#345d9c;padding:12px 15px;border-radius:17px;max-width:80%;overflow-wrap:anywhere}.bubble time{display:block;font-size:10px;color:#cbd8ec;margin-top:5px;text-align:right}.composer{display:flex;gap:8px;padding:12px;background:#1a2638;padding-bottom:max(12px,env(safe-area-inset-bottom))}.composer input{flex:1;min-width:0;border:1px solid #3b4c65;border-radius:14px;background:#101827;color:white;padding:13px;font-size:16px}.panel{padding:18px;background:#202f46;border-top:1px solid #3b4c65}.panel label{display:block;margin:10px 0}.panel select{background:#101827;color:white;padding:8px;border-radius:8px}.note{font-size:12px;color:#afc0d5;line-height:1.5}.hidden{display:none}.lock{position:fixed;inset:0;background:#101827;display:flex;justify-content:center;align-items:center;padding:20px}.lock.hidden{display:none}.lockbox{width:min(100%,350px);background:#1a2638;border-radius:22px;padding:26px;text-align:center}.lockbox input{width:100%;padding:13px;font-size:18px;border-radius:10px;border:0;margin:12px 0}.lockbox button{width:100%;padding:13px;background:#5a88e8;color:white;border:0;border-radius:10px}</style></head><body><div class="app"><header class="head"><div><strong>Private Chat</strong><span class="small">ローカル試作版・通信なし</span></div><button id="settings">設定</button></header><section id="messages" class="messages" aria-live="polite"></section><section id="panel" class="panel hidden"><label>自動削除 <select id="expiry"><option value="0">なし</option><option value="300000">5分</option><option value="3600000">1時間</option><option value="86400000">24時間</option></select></label><button id="clear">全メッセージ削除</button><button id="lockBtn">ロック</button><p class="note">この試作版は、この端末内でのみ動きます。メッセージはサーバーへ送信されず、2人での通信や写真送信には未対応です。端末内の保存データは暗号化されていません。機密情報を入力しないでください。</p></section><form id="composer" class="composer"><input id="message" autocomplete="off" maxlength="2000" placeholder="メッセージ（試作用）" aria-label="メッセージ"><button>送信</button></form></div><div id="lock" class="lock"><div class="lockbox"><h2>Private Chat</h2><p id="lockHelp">初回の4〜12桁の数字PINを設定</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" placeholder="PIN"><button id="unlock">続ける</button><p class="note">PINはこの端末内での簡易ロック用です。強固な認証ではありません。</p></div></div><script>const $=x=>document.getElementById(x);const key='privatechat_demo_messages';let msgs=[];try{msgs=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let pin=localStorage.getItem('privatechat_demo_pin');$('lockHelp').textContent=pin?'PINを入力して開く':'初回の4〜12桁の数字PINを設定';function render(){const now=Date.now();msgs=msgs.filter(m=>!m.expires||m.expires>now);localStorage.setItem(key,JSON.stringify(msgs));$('messages').replaceChildren();for(const m of msgs){const b=document.createElement('div');b.className='bubble';const t=document.createElement('span');t.textContent=m.text;const time=document.createElement('time');time.textContent=new Date(m.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});b.append(t,time);$('messages').append(b)}$('messages').scrollTop=$('messages').scrollHeight}function lock(){ $('lock').classList.remove('hidden');$('pin').value=''}$('unlock').onclick=()=>{const value=$('pin').value;if(!/^[0-9]{4,12}$/.test(value)){alert('4〜12桁の数字を入力してください');return}if(!pin){pin=value;localStorage.setItem('privatechat_demo_pin',pin)}if(value!==pin){alert('PINが違います');return}$('lock').classList.add('hidden');$('pin').value='';render()};$('settings').onclick=()=>$('panel').classList.toggle('hidden');$('lockBtn').onclick=lock;$('clear').onclick=()=>{if(confirm('この端末内のメッセージを削除しますか？')){msgs=[];render()}};$('composer').onsubmit=e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;const ttl=Number($('expiry').value);msgs.push({text,at:Date.now(),expires:ttl?Date.now()+ttl:null});$('message').value='';render()};document.addEventListener('visibilitychange',()=>{if(document.hidden)lock();else if($('lock').classList.contains('hidden'))render()});</script></body></html>
